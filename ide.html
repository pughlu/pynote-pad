<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyNote Web IDE</title>

    <!-- 1. Tailwind & Fonts -->
    <link rel="stylesheet" href="/src/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- 2. PyNote Stylesheets -->
    <link rel="stylesheet" href="/src/pynote-core.css">
    <link rel="stylesheet" href="/src/markdown-styles.css">

    <!-- 3. Third-Party Runtime Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/6.0.1/autosize.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <!-- Split.js for Resizable Panels -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>

    <!-- 4. MathJax Setup -->
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, startup: { typeset: false } };
        if (typeof marked !== 'undefined' && marked.setOptions) marked.setOptions({ breaks: true });
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- 5. PyNote Core Scripts -->
    <script type="module" src="/src/notebook-format.ts"></script>
    <script type="module" src="/src/notebook-generic.ts"></script>
    <script type="module" src="/src/text-cells.ts"></script>
    <script type="module" src="/src/markdown-cells.ts"></script>
    <script type="module" src="/src/code-cells.ts"></script>
    <script type="module" src="/src/markdown-widget-registry.ts"></script>
    <script type="module" src="/src/plugin-csv.ts"></script>
    <script type="module" src="/src/markdown-cells-embedded-code.ts"></script>
    
    <style>
        /* Split.js Gutter Styling */
        .gutter { background-color: #f1f5f9; background-repeat: no-repeat; background-position: 50%; transition: background-color 0.2s; }
        .gutter:hover { background-color: #cbd5e1; }
        .gutter.gutter-horizontal { cursor: col-resize; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; height: 100%; }
        
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Pragmatic Robust Layout: User's flexbox fix */
        .ide-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .panel-scroll-shell {
            display: flex;
            flex-direction: column;
            flex: 1 1 0%;
            min-height: 0;
            width: 100%;
            overflow: hidden;
        }

        .panel-scroll-viewport {
            flex: 1 1 0%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-slate-50 text-slate-800 m-0 p-0">

    <!-- Hidden File Input for Loading -->
    <input type="file" id="file-upload" class="hidden" accept=".py,.txt,.json,.ipynb">

    <!-- TOP NAVBAR CONTAINER (NavbarPanel mounts here) -->
    <nav id="navbar-container" class="bg-slate-800 text-slate-200 flex items-center px-2 py-1 text-[13px] shrink-0 relative z-50 shadow-md font-sans select-none"></nav>

    <!-- 3-PANE WORKSPACE (Split.js Target) -->
    <div class="flex-1 flex overflow-hidden min-h-0 w-full h-full relative" id="split-container">
        <!-- LHS: File Explorer Panel (FileExplorerPanel mounts here) -->
        <aside id="lhs-panel" class="ide-panel bg-white shrink-0 overflow-hidden relative z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]"></aside>

        <!-- MAIN: Editor & Workspace Panel (EditorPanel mounts here) -->
        <main id="main-panel" class="ide-panel bg-[#f3f4f6] relative overflow-hidden min-h-0"></main>

        <!-- RHS: Configuration Panel (ConfigPanel mounts here) -->
        <aside id="rhs-panel" class="ide-panel bg-white shrink-0 overflow-hidden relative z-10 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.05)]"></aside>
    </div>

    <!-- Modular TypeScript IDE Entry Point -->
    <script type="module" src="/src/ide/ide-main.ts"></script>

</html>
