<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyNote Widget</title>

    <!-- 1. Tailwind & Fonts -->
    <link rel="stylesheet" href="/src/tailwind-compiled.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- 2. PyNote Stylesheets -->
    <link rel="stylesheet" href="/src/pynote-core.css">
    <link rel="stylesheet" href="/src/markdown-styles.css">

    <!-- 3. Third-Party Runtime Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/6.0.1/autosize.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <!-- 4. MathJax Setup -->
    <script>
        MathJax = {
          tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
          startup: { typeset: false }
        };
        if (typeof marked !== 'undefined' && marked.setOptions) {
            marked.setOptions({ breaks: true });
        }
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="text-slate-800 flex flex-col transition-none layout-inline">

    <!-- Connection / Status Overlay -->
    <div id="error-modal" class="fixed inset-0 bg-white/80 z-50 flex-col items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl border border-slate-200 text-center">
            <p class="font-bold text-red-500 mb-4" id="modal-msg">Widget disconnected</p>
            <button id="reconnect-btn" class="bg-blue-500 text-white px-4 py-2 rounded-md font-bold shadow-sm hover:bg-blue-600 transition-colors flex items-center justify-center gap-2 mx-auto">
                <span id="btn-text">Try to connect</span>
                <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            </button>
        </div>
    </div>

<header id="main-header" class="hidden bg-white border-b border-slate-200 px-4 py-2 flex justify-between items-center shrink-0 z-40 sticky top-0 shadow-sm">
        <div class="flex items-center gap-3">
            <h1 class="text-base font-semibold tracking-tight">PyNote</h1>
            
            <!-- NEW: Interactive Kernel Status & Selector -->
            <div id="kernel-status-wrapper" class="ml-4 flex items-center gap-1.5 text-[11px] font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded-md tracking-wider border border-slate-200 shadow-inner">
                <div id="kernel-status-indicator" class="flex items-center gap-1.5 uppercase min-w-[70px]">
                    Starting...
                </div>
                <div class="w-px h-3 bg-slate-300 mx-0.5"></div>
                <select id="kernel-selector" onchange="notebookCore.switchKernel(this.value)" class="bg-transparent border-none outline-none cursor-pointer font-bold text-slate-600 hover:text-slate-900 uppercase text-[10px] text-center appearance-none px-1">
                    <option value="pyodide">Pyodide</option>
                    <option value="skulpt">Skulpt</option>
                </select>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="notebookCore.restartKernel()" class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 rounded hover:bg-slate-200 transition-colors shadow-sm" title="Restart Kernel">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Restart
            </button>
            <button id="btn-reset" class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 rounded hover:bg-slate-200 transition-colors shadow-sm hidden" title="Reset to Original Template">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                Reset
            </button>
            <button id="btn-share" class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 rounded hover:bg-slate-200 transition-colors shadow-sm hidden" title="Share Notebook">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                Share
            </button>
            <div class="w-px h-4 bg-slate-300 mx-1"></div>
            <button id="run-all-btn" onclick="notebookCore.runAll()" class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 rounded hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                Run All
            </button>
        </div>
    </header>

    <main class="p-4 flex flex-col w-full box-border" id="main-content">
        <div class="w-full flex flex-col relative box-border">
            <div id="top-inserter" class="h-3 group-hover/inserter:h-6 transition-all duration-300 delay-0 group-hover/inserter:delay-250 relative cursor-pointer w-4/5 mx-auto mb-1.5 z-10 flex items-center justify-center group/inserter" title="Add cell at top">
                <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 flex items-center"><div class="h-px w-full bg-transparent group-hover/inserter:bg-blue-400 transition-colors"></div></div>
                <div class="relative z-10 flex items-center justify-center w-6 h-6 rounded-full bg-blue-500 text-white shadow-sm opacity-0 group-hover/inserter:opacity-100 transition-opacity duration-300 delay-0 group-hover/inserter:delay-250 mx-auto border-2 border-white">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                </div>
            </div>
            <div id="notebook-container" class="pb-2 relative flex flex-col w-full box-border"></div>
        </div>
    </main>

    <!-- Global Helpers -->
    <script>
        // Bulletproof MathJax Helper to prevent iframe crashes
        window.MathJaxHelper = {
            queue: function(el, onComplete) {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([el]).then(() => {
                        if (onComplete) onComplete();
                    }).catch(err => console.warn("MathJax error:", err));
                } else if (!this._retryCount || this._retryCount < 10) {
                    this._retryCount = (this._retryCount || 0) + 1;
                    setTimeout(() => window.MathJaxHelper.queue(el, onComplete), 500);
                } else {
                    console.warn("MathJax failed to load in this environment. Skipping render.");
                    if (onComplete) onComplete();
                }
            }
        };
    </script>
<!-- Core Styles (Loaded above in head) -->

    <!-- Notebook Architecture (ORDER MATTERS) -->
    <script type="module" src="/src/notebook-format.ts"></script>
    <script type="module" src="/src/notebook-generic.ts"></script> <!-- Defines BaseNotebookCell -->
    <script type="module" src="/src/text-cells.ts"></script>
    <script type="module" src="/src/markdown-cells.ts"></script>
    <script type="module" src="/src/code-cells.ts"></script> <!-- Must be loaded last! -->

    <!-- Plugins -->
    <script type="module" src="/src/markdown-widget-registry.ts"></script>
    <script type="module" src="/src/plugin-csv.ts"></script>
    <script type="module" src="/src/markdown-cells-embedded-code.ts"></script>
    


    <!-- Bootstrap & LMS Widget Manager Sync -->
    <script>
        const errorModal = document.getElementById('error-modal');
        const reconnectBtn = document.getElementById('reconnect-btn');
        let pendingSyncId = null, syncTimeout = null, initTimeout = null;
        let lastSentHeight = 0;
        let isLocked = false;
        let isStandaloneFallback = false;
        let currentOriginalTemplate = '';
        
        // Parse UI config from URL query params (set by parent iframe creator)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('topBar') === '1') {
            document.getElementById('main-header').classList.remove('hidden');
        }
        if (urlParams.get('shareBtn') === '1') {
            document.getElementById('btn-share').classList.remove('hidden');
        }
        
        let urlKernelType = null;
        if (urlParams.has('kernel')) {
            urlKernelType = urlParams.get('kernel');
            const kernelSelect = document.getElementById('kernel-selector');
            if (kernelSelect) {
                kernelSelect.value = urlKernelType;
                if (urlParams.get('lockKernel') === '1') {
                    kernelSelect.disabled = true;
                    kernelSelect.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }
        }

        const lockWidget = (message = "Widget disconnected") => { 
            if (isStandaloneFallback) return;
            isLocked = true;
            document.getElementById('modal-msg').innerText = message;
            document.body.style.overflow = 'hidden';
            errorModal.style.display = 'flex'; 
        }

        function unlockWidget() { 
            isLocked = false;
            document.body.style.overflow = ''; 
            errorModal.style.display = 'none'; 
            reconnectBtn.querySelector('#btn-spinner').classList.add('hidden'); 
            reconnectBtn.disabled = false; 
            reconnectBtn.querySelector('#btn-text').innerText = 'Try to connect'; 
        }

        function sendHeight() {
            const mainContent = document.getElementById('main-content');
            const header = document.getElementById('main-header');
            if (!mainContent) return;

            const headerHeight = (header && !header.classList.contains('hidden')) ? header.scrollHeight : 0;
            const contentHeight = mainContent.scrollHeight; 
            const totalHeight = headerHeight + contentHeight;

            if (Math.abs(totalHeight - lastSentHeight) > 2) {
                lastSentHeight = totalHeight;
                window.parent.postMessage({ type: 'SYNC_HEIGHT', payload: { height: Math.max(totalHeight, 150) } }, '*');
            }
        }

        window.triggerHostSync = function(contentString) {
            if (isStandaloneFallback || isLocked) return; 
            
            pendingSyncId = 'msg-' + Date.now().toString() + Math.random().toString().substr(2, 5);
            window.parent.postMessage({ 
                type: 'SYNC_CONTENT', 
                payload: { content: contentString, msgId: pendingSyncId }
            }, '*');
            
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => lockWidget("Failed to save changes to host (No ACK received)."), 5000);
            
            window.requestAnimationFrame(sendHeight);
        };

        reconnectBtn.addEventListener('click', () => {
            reconnectBtn.querySelector('#btn-spinner').classList.remove('hidden');
            reconnectBtn.querySelector('#btn-text').innerText = 'Connecting...';
            reconnectBtn.disabled = true;
            window.parent.postMessage({ type: 'REQUEST_CONTENT' }, '*');
            syncTimeout = setTimeout(() => { unlockWidget(); lockWidget(); }, 2000);
        });

        window.addEventListener('message', (event) => {
            let msg = event.data;
            if (typeof msg === 'string') {
                try { msg = JSON.parse(msg); } catch (e) { return; }
            }
            if (!msg || typeof msg !== 'object') return;

            switch (msg.type) {
                case 'LOAD_CONTENT': {
                    clearTimeout(initTimeout); 
                    isStandaloneFallback = false;
                    
                    const payload = msg.payload || {};
                    const config = payload.config || {};
                    const content = payload.content || '';
                    
                    if (config.showTopBar) {
                        document.getElementById('main-header').classList.remove('hidden');
                    }
                    
                    if (config.layout === 'edge') {
                        document.body.classList.remove('layout-inline');
                        document.body.classList.add('layout-edge');
                    }

                    if (config.showShareButton) {
                        document.getElementById('btn-share').classList.remove('hidden');
                    }
                    
                    if (config.originalTemplate) {
                        currentOriginalTemplate = config.originalTemplate;
                        document.getElementById('btn-reset').classList.remove('hidden');
                    }
                    
                    // Map LMS run modes to PyNote specific flags
                    if (config.runMode === 'attempt') {
                        config.disableInsertAll = config.disableInsertAll ?? true;
                        config.disableInsertTop = config.disableInsertTop ?? true;
                        config.disableDelete = config.disableDelete ?? true;
                        config.disableMove = config.disableMove ?? true;
                        config.lockAllMarkdown = config.lockAllMarkdown ?? true;
                    } else if (config.runMode === 'review') {
                        config.isReadOnly = true;
                    }
                    
                    if (urlKernelType) {
                        config.kernelType = urlKernelType;
                    }

                    window.notebookCore = new window.NotebookCore('notebook-container', config);
                    
                    if (content) {
                        const cells = window.notebookCore.deserializeFromFlat(content);
                        window.notebookCore.loadData(cells);
                    }
                    
                    unlockWidget();
                    clearTimeout(syncTimeout);
                    setTimeout(sendHeight, 300);
                    break;
                }

                case 'SYNC_ACK': {
                    const ackMsgId = msg.msgId || (msg.payload && msg.payload.msgId);
                    if (ackMsgId === pendingSyncId) {
                        clearTimeout(syncTimeout);
                    }
                    break;
                }
                
                case 'SET_WIDGET_CONFIG': {
                    const extraConf = msg.payload || {};
                    if (extraConf.showTopBar && extraConf.showTopBar !== 'false') {
                        document.getElementById('main-header').classList.remove('hidden');
                    }
                    if (extraConf.showShareButton && extraConf.showShareButton !== 'false') {
                        document.getElementById('btn-share').classList.remove('hidden');
                    }
                    if (extraConf.originalTemplate) {
                        currentOriginalTemplate = extraConf.originalTemplate;
                        document.getElementById('btn-reset').classList.remove('hidden');
                    }
                    if (window.notebookCore) {
                        window.notebookCore.options = Object.assign(window.notebookCore.options, extraConf);
                    }
                    break;
                }

                case 'ERROR_LOCKDOWN': {
                    lockWidget(msg.payload?.message || "Fatal error occurred.");
                    break;
                }

                case 'INSERT_CONTENT': {
                    if (isLocked) return;
                    const insertContent = msg.payload?.content;
                    if (insertContent && window.notebookCore) {
                        // PyNote specific append logic - add as code cell at end
                        window.notebookCore.addCell('code', window.notebookCore.cells.length);
                        const newCell = window.notebookCore.cells[window.notebookCore.cells.length - 1];
                        newCell.setContent(insertContent);
                        window.notebookCore.triggerUpdate();
                    }
                    break;
                }
            }
        });
        
        const btnShare = document.getElementById('btn-share');
        if (btnShare) {
            btnShare.addEventListener('click', () => {
                if (typeof LZString === 'undefined' || !window.notebookCore) return;
                const code = window.notebookCore.serializeToFlat();
                const compressed = LZString.compressToEncodedURIComponent(code);
                const url = new URL(window.location.href);
                url.hash = 'c=' + compressed;
                
                navigator.clipboard.writeText(url.href).then(() => {
                    const originalContent = btnShare.innerHTML;
                    btnShare.innerHTML = '<span style="color:#4ec9b0;font-weight:bold;">Copied!</span>';
                    setTimeout(() => {
                        btnShare.innerHTML = originalContent;
                    }, 2000);
                }).catch(err => {
                    prompt("Copy this link:", url.href);
                });
            });
        }

        // Tell host we're ready for data, but wait for modules to finish loading
        window.addEventListener('DOMContentLoaded', () => {
            window.parent.postMessage({ type: 'WIDGET_READY' }, '*');
            window.parent.postMessage({ type: 'REQUEST_CONTENT' }, '*');
        });
        
        initTimeout = setTimeout(() => {
            console.log("No host detected. Booting in Standalone Fallback mode.");
            isStandaloneFallback = true;
            document.getElementById('main-header').classList.remove('hidden');
            
            const topInserter = document.getElementById('top-inserter');
            if (topInserter) topInserter.onclick = () => window.notebookCore.addCell('code', 0);
            
            document.getElementById('btn-share').classList.remove('hidden');

            window.notebookCore = new window.NotebookCore('notebook-container', { isReadOnly: false });
            
            let initialCode = '# %% [code]\nprint("Standalone Mode")';
            if (window.location.hash.startsWith('#c=')) {
                if (typeof LZString !== 'undefined') {
                    const decompressed = LZString.decompressFromEncodedURIComponent(window.location.hash.substring(3));
                    if (decompressed) initialCode = decompressed;
                }
            }
            
            const fallbackCells = window.notebookCore.deserializeFromFlat(initialCode);
            window.notebookCore.loadData(fallbackCells);
            unlockWidget();
        }, 1500);

        new ResizeObserver(() => {
            window.requestAnimationFrame(sendHeight);
        }).observe(document.body);

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (!currentOriginalTemplate) return;
            if (confirm("Are you sure you want to reset the notebook? All your current work will be lost!")) {
                const cells = window.notebookCore.deserializeFromFlat(currentOriginalTemplate);
                window.notebookCore.loadData(cells);
                window.notebookCore.syncToServer();
            }
        });

    </script>
</body>
</html>
